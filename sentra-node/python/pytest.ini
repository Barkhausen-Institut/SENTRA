[pytest]
# Repo layout: ``node/`` (training parties) and ``client/`` (dataset owner); imports stay ``ml_training``, ``sentra_client``.
pythonpath =
    node
    client
testpaths =
    node/testing
    node/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    benchmark: marks tests for benchmarks
