# Same as with-client.yaml but enables per-epoch weight versioning (KVS persist).
# Compare runtime_metrics versioning_sec_total vs a non-versioned run for overhead %.

headless: true
host: "127.0.0.1"
n-nodes: 3
t: 1
base-port: 9330
batch-size: 64
accum-steps: 1
num-epochs: 10
mnist-samples: 10000
learning-rate: 0.002
seed: 2026
loss-mode: softmax
scale-factor: 65536
field-size: 2305843009213693951
softmax-temperature: 2.0
grad-clip: 0.5
logit-clip: 4.0
exp-approx: pade22
softmax-grad-mode: secure_approx
explode-logit-threshold: 100.0
loss-growth-threshold: 5.0
grad-norm-threshold: 1500.0
no-abort-on-instability: true
debug-numerics: false
membership-epoch: 0
receive-dataset-shares-from-client: true
dataset-source-node-id: 0
dataset-distribution-timeout: 900.0
start-client-distributor: true
client-eval-after-training: true
client-eval-batched-receive: true
client-eval-samples: 100
client-test-samples: 100
use-weight-versioning: true
